service: echo-inventory
frameworkVersion: '4'

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  environment:
    TABLE_NAME: EchoInventory
    BUCKET_NAME: echo-inventory-images-local
    MODEL_ID: amazon.nova-lite-v1:0
    USER_POOL_ID: local-user-pool
    USER_POOL_CLIENT_ID: local-client
    IS_LOCAL: 'true'
    # Routes all AWS SDK calls (DynamoDB, S3) to LocalStack
    AWS_ENDPOINT_URL: http://localhost:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    # Bundle all dependencies including AWS SDK v3
    exclude: []
    watch:
      pattern:
        - 'functions/**/*.ts'
        - 'functions/shared/**/*.ts'

  serverless-offline:
    httpPort: 3001
    lambdaPort: 3002
    noPrependStageInUrl: true

functions:
  orgs:
    handler: functions/orgs/index.handler
    events:
      - httpApi:
          path: /public/orgs
          method: GET
      - httpApi:
          path: /public/orgs/{proxy+}
          method: ANY

  inventory:
    handler: functions/inventory/index.handler
    events:
      - httpApi:
          path: /orgs/{orgId}/inventory
          method: ANY
      - httpApi:
          path: /orgs/{orgId}/inventory/{proxy+}
          method: ANY

  members:
    handler: functions/members/index.handler
    events:
      - httpApi:
          path: /orgs/{orgId}/members
          method: ANY
      - httpApi:
          path: /orgs/{orgId}/members/{proxy+}
          method: ANY

  image:
    handler: functions/image/index.handler
    events:
      - httpApi:
          path: /orgs/{orgId}/capture
          method: POST
      - httpApi:
          path: /public/orgs/{orgId}/capture
          method: POST
